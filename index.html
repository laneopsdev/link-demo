<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Link by LaneOps</title>

<style>
:root{
  --orange:#f97316;
  --green:#22c55e;
  --ink:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --soft:#f8fafc;
  --card:#ffffff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
  min-height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 8% 10%, rgba(249,115,22,.10), transparent 30%),
    radial-gradient(circle at 92% 20%, rgba(34,197,94,.07), transparent 28%),
    linear-gradient(135deg,#ffffff,#f8fafc);
  color:var(--ink);
}

/* ================= APP LAYOUT ================= */
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:430px 1fr;
  overflow:visible;
}

/* ================= LEFT SIDEBAR ================= */
.left{
  min-height:100vh;
  padding:26px;
  border:none;
  background:transparent;
  overflow:visible;
  display:flex;
  flex-direction:column;
}

/* ================= BRAND ================= */
.brand{
  margin-bottom:22px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.link-brand{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.link-logo{
  width:235px;
  height:auto;
  display:block;
  object-fit:contain;

  filter:
    drop-shadow(0 10px 24px rgba(15,23,42,.08))
    drop-shadow(0 0 18px rgba(249,115,22,.06));

  transition:transform .22s ease;
}

.link-logo:hover{
  transform:translateY(-1px);
}

.brand-tagline{
  margin-top:10px;

  font-size:14px;
  font-weight:700;
  color:#6b7280;

  letter-spacing:.01em;
  text-align:center;
}
/* ================= SEARCH + ADD AREA ================= */

.hero-search{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(16px);
  border-radius:30px;
  padding:20px;
  box-shadow:
    0 24px 60px rgba(15,23,42,.08),
    0 0 30px rgba(249,115,22,.06);
  margin-bottom:18px;
  position:relative;
}

.hero-search label{
  display:block;
  font-size:12px;
  font-weight:950;
  letter-spacing:.14em;
  color:var(--orange);
  margin-bottom:12px;
  position:relative;
  z-index:2;
}

.search-row{
  display:flex;
  gap:12px;
  position:relative;
  z-index:2;
}

.search-row input{
  flex:1;
  height:64px;
  border:none;
  outline:none;
  background:#f8fafc;
  border-radius:20px;
  padding:0 18px;
  font-size:18px;
  font-weight:850;
  color:#111827;
  box-shadow:inset 0 0 0 1px rgba(229,231,235,.9);
  transition:.22s ease;
}

.search-row input:focus{
  background:#fff;
  box-shadow:
    inset 0 0 0 2px rgba(249,115,22,.35),
    0 0 0 5px rgba(249,115,22,.08);
}

.search-row button{
  width:102px;
  border:none;
  border-radius:22px;
  background:#0f172a;
  color:#fff;

  font-size:13px;
  font-weight:900;
  letter-spacing:.08em;

  cursor:pointer;
  transition:.22s ease;

  box-shadow:
    0 10px 24px rgba(15,23,42,.16),
    inset 0 0 0 1px rgba(255,255,255,.04);
}

.search-row button:hover{
  transform:translateY(-2px);
  background:#020617;
  box-shadow:
    0 18px 34px rgba(15,23,42,.20),
    0 0 0 3px rgba(249,115,22,.08);
}

.search-row button:active{
  transform:scale(.97);
}

.add-tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.add-tools button{
  border:none;
  border-radius:16px;
  padding:13px;
  font-weight:950;
  cursor:pointer;
}

.add-carrier-btn{
  background:var(--orange);
  color:white;
}

.upload-btn{
  background:#111827;
  color:white;
}

/* ================= BLAST MINI BAR ================= */
.blast-summary{
  background:#111827;
  color:#fff;
  border-radius:20px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 18px 42px rgba(15,23,42,.18);
}

.blast-summary-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.blast-summary h3{
  font-size:14px;
}

.blast-count{
  color:var(--green);
  font-weight:900;
}

.blast-actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.blast-actions button{
  flex:1;
  border:none;
  border-radius:14px;
  padding:11px;
  font-weight:900;
  cursor:pointer;
}

.open-blast{
  background:var(--orange);
  color:#fff;
}

.clear-blast{
  background:#1f2937;
  color:#d1d5db;
}

.section-title{
  font-size:12px;
  font-weight:950;
  color:var(--muted);
  letter-spacing:.12em;
  margin:14px 0 12px;
}

/* ================= CONTACT SCROLL AREA ================= */
.contact-scroll{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:8px;
  padding-bottom:80px;
  min-height:0;
  max-height:none;
  position:relative;
  scrollbar-width:thin;
  scrollbar-color:rgba(17,24,39,.18) transparent;
}

.contact-scroll::-webkit-scrollbar,
.right::-webkit-scrollbar{
  width:5px;
}

.contact-scroll::-webkit-scrollbar-track,
.right::-webkit-scrollbar-track{
  background:transparent;
}

.contact-scroll::-webkit-scrollbar-thumb,
.right::-webkit-scrollbar-thumb{
  background:rgba(17,24,39,.16);
  border-radius:99px;
}

.contact-scroll:hover::-webkit-scrollbar-thumb,
.right:hover::-webkit-scrollbar-thumb{
  background:rgba(17,24,39,.28);
}

/* ================= CONTACT CARDS ================= */
.top-badge{
  position:absolute;
  top:12px;
  right:12px;

  background:rgba(249,115,22,.12);
  color:#f97316;

  font-size:10px;
  font-weight:950;
  letter-spacing:.12em;

  padding:6px 10px;
  border-radius:999px;

  border:1px solid rgba(249,115,22,.18);

  backdrop-filter:blur(8px);

}
.contact.rank-one{
  padding:22px 16px;
  min-height:138px;

  background:
    radial-gradient(circle at top right, rgba(249,115,22,.22), transparent 42%),
    linear-gradient(135deg, rgba(255,255,255,.98), rgba(255,247,237,.96));

  border:1px solid rgba(249,115,22,.34);

  box-shadow:
    0 24px 55px rgba(249,115,22,.18),
    0 0 0 4px rgba(249,115,22,.055);

  transform:scale(1.015);
}
.contact.rank-one .avatar{
  width:64px;
  height:64px;
  border-radius:22px;
  background:#ffedd5;

  box-shadow:
    0 12px 28px rgba(249,115,22,.20);
}

.contact.rank-one .name{
  font-size:20px;
}

.contact.rank-one .last-used{
  color:#f97316;
}


.contact{
  display:flex;
  align-items:center;
  gap:13px;
  padding:16px;
  border-radius:24px;
  cursor:pointer;

  transition:
    transform .22s ease,
    background .22s ease;

  margin-bottom:12px;
  position:relative;

  background:rgba(255,255,255,.55);
  backdrop-filter:blur(10px);

  box-shadow:none;

  will-change:transform;
}

.contact:hover,
.contact.active{
  background:rgba(255,255,255,.82);
  transform:translateY(-2px);

  box-shadow:
    0 10px 24px rgba(15,23,42,.06);
}

.contact.top-three:hover{
  box-shadow:
    0 12px 28px rgba(249,115,22,.10);
}

.contact.added{
  outline:2px solid rgba(34,197,94,.35);
  background:#f0fdf4;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:17px;
  font-weight:950;
  flex-shrink:0;
}

.a1{background:#ffedd5;}
.a2{background:#dcfce7;}
.a3{background:#ede9fe;}
.a4{background:#dbeafe;}
.a5{background:#fef9c3;}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:17px;
  font-weight:900;
  margin-bottom:4px;
}

.sub{
  font-size:13px;
  color:#4b5563;
  line-height:1.35;
}

.last-used{
  font-size:12px;
  color:var(--green);
  font-weight:900;
  margin-top:4px;
}

.add-to-blast{
  border:none;
  border-radius:13px;
  background:#111827;
  color:#fff;
  padding:10px 11px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
}

.add-to-blast.added{
  background:var(--green);
}

.contact:hover .avatar{
  transform:scale(1.035);
  box-shadow:0 12px 24px rgba(249,115,22,.10);
}

.contact:hover .add-to-blast{
  background:#020617;
  transform:translateY(-1px);
  box-shadow:0 12px 22px rgba(15,23,42,.16);
}

.contact:hover .add-to-blast.added{
  background:var(--green);
}

.avatar,
.add-to-blast{
  transition:.22s ease;
}

/* ================= HOVER PREVIEW ================= */
.preview{
  position:absolute;
  left:100%;
  top:50%;
  transform:translate(14px,-50%) scale(.96);
  width:260px;
  background:#111827;
  color:white;
  padding:15px;
  border-radius:18px;
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
  z-index:30;
  box-shadow:0 24px 60px rgba(15,23,42,.28);
}

.contact:hover .preview{
  opacity:1;
  transform:translate(18px,-50%) scale(1);
}

.preview h4{
  font-size:15px;
  margin-bottom:8px;
}

.preview p{
  font-size:13px;
  color:#d1d5db;
  line-height:1.45;
}

.preview strong{
  color:var(--green);
}

/* ================= RIGHT WORKSPACE ================= */
.right{
  min-height:100vh;
  padding:30px;
  overflow:visible;
}

/* ================= WELCOME SCREEN ================= */
.welcome{
  min-height:calc(100vh - 60px);
  display:grid;
  place-items:center;
  animation:openCard .34s ease both;
}

.welcome-card{
  width:min(780px,100%);
  background:rgba(255,255,255,.88);
  border:1px solid rgba(229,231,235,.9);
  border-radius:32px;
  padding:42px;
  box-shadow:0 28px 80px rgba(15,23,42,.09);
  text-align:center;
}

.welcome-kicker{
  color:var(--orange);
  font-size:12px;
  font-weight:950;
  letter-spacing:.18em;
  margin-bottom:14px;
}

.welcome-card h2{
  font-size:46px;
  line-height:1;
  margin-bottom:14px;
}

.welcome-card p{
  color:var(--muted);
  font-size:18px;
  line-height:1.55;
  max-width:620px;
  margin:0 auto 24px;
}

.drop-zone{
  border:2px dashed rgba(249,115,22,.35);
  background:#fff7ed;
  border-radius:24px;
  padding:30px;
  margin-top:24px;
}

.drop-zone strong{
  display:block;
  font-size:20px;
  margin-bottom:8px;
}

.drop-zone span{
  color:var(--muted);
  font-weight:700;
}

.welcome-actions{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:24px;
}

.welcome-actions button{
  border:none;
  border-radius:17px;
  padding:15px 20px;
  font-weight:950;
  cursor:pointer;
}

.primary{
  background:var(--orange);
  color:white;
}

.dark{
  background:#111827;
  color:white;
}

/* ================= CARD OPEN TRANSITION ================= */
.card-shell{
  animation:openCard .34s ease both;
}

@keyframes openCard{
  from{opacity:0; transform:translateY(14px) scale(.985);}
  to{opacity:1; transform:translateY(0) scale(1);}
}

/* ================= PROFILE ================= */
.profile{
  background:rgba(255,255,255,.94);
  border:1px solid rgba(229,231,235,.9);
  border-radius:24px;
  padding:26px;
  box-shadow:0 24px 62px rgba(15,23,42,.08);
  margin-bottom:20px;
}

.profile-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  margin-bottom:22px;
}

.profile-left{
  display:flex;
  gap:20px;
  align-items:center;
}

.big-avatar{
  width:98px;
  height:98px;
  border-radius:24px;
  background:#ffedd5;
  display:grid;
  place-items:center;
  font-size:34px;
  font-weight:950;
}

.profile h2{
  font-size:38px;
  line-height:1;
  margin-bottom:8px;
}

.profile p{
  color:var(--muted);
  font-size:16px;
}

.profile .last{
  color:var(--green);
  font-weight:900;
  margin-top:7px;
}

.score{
  text-align:right;
}

.score strong{
  display:block;
  font-size:32px;
  color:var(--orange);
}

.score span{
  font-size:12px;
  color:var(--muted);
  font-weight:900;
  letter-spacing:.12em;
}

.actions{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.action{
  border:none;
  background:#f8fafc;
  border-radius:17px;
  padding:15px 8px;
  cursor:pointer;
  font-weight:900;
  transition:.22s ease;
}

.action span{
  display:block;
  font-size:23px;
  margin-bottom:6px;
  color:var(--orange);
}

.action:hover{
  background:#fff;
  transform:translateY(-3px);
  box-shadow:0 14px 28px rgba(249,115,22,.12);
}

.action.green span{
  color:var(--green);
}

/* ================= DETAIL GRID ================= */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.box{
  background:rgba(255,255,255,.95);
  border:1px solid rgba(229,231,235,.9);
  border-radius:22px;
  padding:22px;
  box-shadow:0 16px 38px rgba(15,23,42,.055);
}

.box.full{
  grid-column:1 / -1;
}

.box-title{
  font-size:12px;
  font-weight:950;
  letter-spacing:.12em;
  color:var(--muted);
  margin-bottom:16px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:15px;
}

.row:last-child{
  border-bottom:none;
}

.label{
  color:var(--muted);
}

.value{
  font-weight:850;
  text-align:right;
}

.orange{color:var(--orange);}
.green{color:var(--green);}

.notes{
  width:100%;
  min-height:110px;
  border:1px solid var(--line);
  outline:none;
  border-radius:18px;
  padding:15px;
  resize:vertical;
  background:#f8fafc;
  font-size:15px;
}

.notes:focus{
  background:#fff;
  border-color:rgba(249,115,22,.45);
  box-shadow:0 0 0 4px rgba(249,115,22,.08);
}

.quick-note-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:13px;
}

.quick-note-row button{
  border:none;
  border-radius:14px;
  padding:11px;
  background:#f8fafc;
  font-weight:850;
  cursor:pointer;
}

.hidden-panel{
  display:none;
  margin-top:14px;
}

.hidden-panel.open{
  display:block;
  animation:openCard .25s ease both;
}

.follow-toggle{
  width:100%;
  border:none;
  border-radius:16px;
  padding:13px;
  background:#111827;
  color:#fff;
  font-weight:950;
  cursor:pointer;
}

.follow-item{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

/* ================= MODALS / OVERLAYS ================= */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.36);
  backdrop-filter:blur(8px);
  z-index:50;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:42px 24px 24px;
}
.overlay.open{
  display:flex;
}

.overlay-card{
  width:min(880px,96vw);
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:26px;
  box-shadow:0 40px 100px rgba(15,23,42,.25);
  padding:26px;
  animation:openCard .28s ease both;
}

.overlay-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:18px;
}

.overlay-top h2{
  font-size:28px;
}

.close{
  border:none;
  background:#f1f5f9;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:24px;
  cursor:pointer;
}

/* ================= FORM STYLES ================= */
.form-grid,
.blast-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:18px;
}

.form-grid input,
.form-grid textarea,
.blast-form input,
.blast-form select,
.blast-form textarea{
  width:100%;
  border:1px solid var(--line);
  outline:none;
  border-radius:16px;
  padding:14px;
  font-size:15px;
  background:#f8fafc;
}

.form-grid textarea,
.blast-form textarea{
  grid-column:1 / -1;
  min-height:80px;
  resize:vertical;
}

.selected-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:18px;
}

.selected-pill{
  padding:12px;
  border-radius:16px;
  background:#f8fafc;
  border:1px solid var(--line);
  font-weight:850;
  animation:pulseCarrier 1.3s ease infinite;
}

@keyframes pulseCarrier{
  0%,100%{box-shadow:0 0 0 rgba(249,115,22,0);}
  50%{box-shadow:0 0 0 4px rgba(249,115,22,.11);}
}

.message-box{
  background:#0f172a;
  color:#fff;
  border-radius:20px;
  padding:20px;
  line-height:1.6;
  min-height:190px;
  white-space:pre-wrap;
  font-size:15px;
  margin-bottom:18px;
}

.overlay-actions{
  display:flex;
  gap:12px;
}

.overlay-actions button{
  flex:1;
  border:none;
  border-radius:16px;
  padding:15px;
  font-weight:950;
  cursor:pointer;
}

.generate{
  background:#111827;
  color:white;
}

.send{
  background:var(--orange);
  color:white;
}

/* ================= MOBILE ================= */
@media(max-width:950px){
  body{
    height:auto;
    overflow:auto;
  }

  .app{
    height:auto;
    grid-template-columns:1fr;
    overflow:visible;
  }

  .left{
    height:auto;
    overflow:visible;
    border-right:none;
    border-bottom:1px solid var(--line);
  }

  .contact-scroll{
    overflow:visible;
  }

  .right{
    height:auto;
    overflow:visible;
  }

  .grid,
  .blast-form,
  .form-grid,
  .selected-list{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:repeat(2,1fr);
  }

  .profile-head,
  .profile-left{
    flex-direction:column;
  }

  .score{
    text-align:left;
  }

  .preview{
    display:none;
  }

  .brand-row{
    gap:8px;
  }

  .link-logo{
    width:142px;
  }

  .by-laneops{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= LEFT SIDEBAR ================= -->
<aside class="left">

  <div class="brand">

<div class="link-brand">

  <img
    class="link-logo"
    src="https://getlaneops.com/wp-content/uploads/2026/05/ChatGPT-Image-May-16-2026-07_59_44-PM.png"
    alt="LINK logo"
  />

</div>

<p class="brand-tagline">
  Your smart carrier contact book.
</p>
  
</div>

<div class="hero-search">
    <label>SEARCH YOUR CARRIER NETWORK</label>

    <div class="search-row">
      <input id="searchInput" placeholder="Search lane, carrier, MC, dispatcher..." />

      <button onclick="runSearch()">LINK</button>
    </div>
  </div>

    <div class="add-tools">
      <button class="add-carrier-btn" onclick="openAddCarrier()">+ Add Carrier</button>
      <button class="upload-btn" onclick="fakeUpload()">Upload Contacts</button>
    </div>

    <div class="blast-summary">
      <div class="blast-summary-top">
        <h3>Blast Cart</h3>
        <div class="blast-count"><span id="blastCount">0</span> selected</div>
      </div>

      <div class="blast-actions">
        <button class="open-blast" onclick="openBlastOverlay()">Open Blast</button>
        <button class="clear-blast" onclick="clearBlast()">Clear</button>
      </div>
    </div>

    <div class="section-title">TOP RANKED CARRIERS</div>

    <div class="contact-scroll">
      <div id="contacts"></div>
    </div>

  </aside>

  <!-- ================= RIGHT WORKSPACE ================= -->
  <main class="right">

/* ================= CONTACT PARSER ================= */
function parsePastedContact(){
  const text = document.getElementById("pasteContact").value.trim();

  if(!text){
    alert("Paste contact info first.");
    return;
  }

  const emailMatch = text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
  const phoneMatch = text.match(/(\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/);
  const mcMatch = text.match(/\bMC\s*#?\s*(\d{5,8})\b/i) || text.match(/\b(\d{5,8})\b/);

  if(emailMatch) document.getElementById("newEmail").value = emailMatch[0];
  if(phoneMatch) document.getElementById("newPhone").value = phoneMatch[0];
  if(mcMatch) document.getElementById("newMc").value = mcMatch[1] || mcMatch[0];

  const lower = text.toLowerCase();

  if(lower.includes("flatbed")) document.getElementById("newEquipment").value = "Flatbed";
  if(lower.includes("reefer")) document.getElementById("newEquipment").value = "Reefer";
  if(lower.includes("dry van") || lower.includes("dryvan")) document.getElementById("newEquipment").value = "Dry Van";
  if(lower.includes("step deck")) document.getElementById("newEquipment").value = "Step Deck";
  if(lower.includes("hotshot")) document.getElementById("newEquipment").value = "Hotshot";

  const firstLine = text.split("\n").find(line => line.trim().length > 2);

  if(firstLine && !document.getElementById("newName").value){
    document.getElementById("newName").value = firstLine.trim();
  }

  document.getElementById("newNotes").value = text;
  
  document.getElementById("pasteBox").style.display = "none";
}

/* ================= FMCSA LOOKUP ================= */
async function lookupMC(){

  const mc = document.getElementById("newMc").value.trim();

  if(!mc){
    alert("Enter an MC number first.");
    return;
  }

  try{
    const url =
      `https://mobile.fmcsa.dot.gov/qc/services/carriers/docket-number/${mc}?webKey=${FMCSA_WEBKEY}`;

    const response = await fetch(url);
    const data = await response.json();

    console.log("FMCSA RESPONSE:", data);

    const carrier =
      data.content?.carrier ||
      data.content?.[0]?.carrier ||
      data.content?.[0] ||
      data.content;

    if(!carrier){
      alert("No carrier found.");
      return;
    }

    document.getElementById("newName").value =
      carrier.legalName ||
      carrier.dbaName ||
      carrier.carrierName ||
      "";

    document.getElementById("newPhone").value =
      carrier.phone || "";

    document.getElementById("newBase").value =
      `${carrier.phyCity || ""}${carrier.phyState ? ", " + carrier.phyState : ""}`;

    document.getElementById("newNotes").value =
`DOT: ${carrier.dotNumber || "N/A"}
MC: ${mc}
Authority: ${carrier.allowedToOperate === "Y" ? "Active" : "Inactive"}
Safety Rating: ${carrier.safetyRating || "N/A"}`;

  }catch(err){
    console.error("FMCSA ERROR:", err);
    alert("FMCSA lookup failed. Check console.");
  }
}

function toggleBlast(email){
  const carrier = carriers.find(c => c.email === email);
  const exists = blastList.some(c => c.email === email);

  if(exists){
    blastList = blastList.filter(c => c.email !== email);
  }else{
    blastList.push(carrier);
  }

  updateBlastCount();
  runSearch();

  if(currentCarrier){
    renderDetail(currentCarrier);
  }
}

  document.getElementById("blastCount").textContent = blastList.length;

function generateBlastMessage(){
  const type = document.getElementById("templateType").value;
  const lane = document.getElementById("laneInput").value;
  const equipment = document.getElementById("equipmentInput").value;
  const pickup = document.getElementById("pickupInput").value;
  const details = document.getElementById("detailsInput").value;

  let message = "";

  if(type === "lane"){
    message =
`Subject: Available ${equipment} Load — ${lane}

Good morning,

Checking availability for a ${equipment} load.

Lane: ${lane}
Pickup: ${pickup}

${details}

Please send your best rate and availability when you get a chance.

Thanks.`;
  }

  if(type === "rate"){
    message =
`Subject: Rate Check — ${lane}

Good morning,

I am checking interest on this lane:

Lane: ${lane}
Equipment: ${equipment}
Pickup: ${pickup}

${details}

Send over your best number if you have a truck that fits.

Thanks.`;
  }

  if(type === "callback"){
    message =
`Subject: Follow-Up — ${lane}

Good morning,

Following up on availability for:

Lane: ${lane}
Equipment: ${equipment}
Pickup: ${pickup}

${details}

Let me know if you can still look at this one.

Thanks.`;
  }

  typeText(message);
}

function typeText(text){
  const box = document.getElementById("typedMessage");
  box.textContent = "";
  let i = 0;

  const interval = setInterval(() => {
    box.textContent += text.charAt(i);
    i++;

    if(i >= text.length){
      clearInterval(interval);
    }
  }, 12);
}

function sendIndividual(email){
  const carrier = carriers.find(c => c.email === email);
  blastList = [carrier];
  updateBlastCount();
  openBlastOverlay();

/* ================= SEARCH ================= */
function runSearch(){
  const rawValue = document.getElementById("searchInput").value;
  const value = rawValue.toLowerCase().trim();

  const terms = value
    .split(/[, ]+/)
    .map(term => term.trim())
    .filter(Boolean);

  const results = carriers.filter(c => {
    const searchableText = `
      ${c.name}
      ${c.dispatcher}
      ${c.equipment}
      ${c.lane}
      ${c.base}
      ${c.mc}
      ${c.notes}
    `.toLowerCase();

    return terms.every(term => searchableText.includes(term));
  });

  renderContacts(results);

  if(value){
    renderLaneSearchResults(rawValue, results);
  }else{
    renderWelcome();
  }
}

            : `

            <div class="box full">

              <div class="box-title">NO MATCHES</div>

              <h3 style="font-size:24px;margin-bottom:10px;">
                No carriers found
              </h3>

              <p style="color:#6b7280;line-height:1.5;">
                No sourced carriers from your contact book match "${searchTerm}" yet.
              </p>

            </div>
          `
        }

      </section>

    </div>
  `;
}

function openCarrierFromResults(email){
  const carrier = carriers.find(c => c.email === email);

  if(!carrier) return;

  currentCarrier = carrier;

  renderContacts(carriers);

  renderDetail(carrier);
}

/* ================= NOTES / FOLLOW UPS ================= */
function addNote(text){
  const box = document.getElementById("noteBox");
  if(box){
    box.value += "\n\n" + text;
  }
}

function toggleFollowUps(){
  const panel = document.getElementById("followPanel");
  if(panel){
    panel.classList.toggle("open");
  }
}

/* ================= EVENT LISTENERS ================= */
document.getElementById("searchInput").addEventListener("input", runSearch);
document.getElementById("templateType").addEventListener("change", generateBlastMessage);
document.getElementById("laneInput").addEventListener("input", generateBlastMessage);
document.getElementById("equipmentInput").addEventListener("input", generateBlastMessage);
document.getElementById("pickupInput").addEventListener("input", generateBlastMessage);
document.getElementById("detailsInput").addEventListener("input", generateBlastMessage);

/* ================= INITIAL LOAD ================= */
renderContacts(carriers);
renderWelcome();
updateBlastCount();
</script>
