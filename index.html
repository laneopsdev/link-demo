<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runit — Live Seller Prompt Tool</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial, sans-serif;
      background:#fff7ed;
      color:#111827;
      min-height:100vh;
      padding:22px;
    }
    .app{
      max-width:520px;
      margin:auto;
    }
    .logo{
      font-size:34px;
      font-weight:900;
      letter-spacing:-1px;
      margin-bottom:8px;
    }
    .logo span{color:#f97316}
    .tagline{
      font-size:17px;
      color:#4b5563;
      margin-bottom:26px;
      line-height:1.4;
    }
    .card{
      background:white;
      border-radius:26px;
      padding:22px;
      box-shadow:0 18px 45px rgba(0,0,0,.08);
      border:1px solid rgba(0,0,0,.05);
      margin-bottom:18px;
    }
    label{
      display:block;
      font-weight:800;
      margin:14px 0 7px;
      font-size:14px;
    }
    input, select, textarea{
      width:100%;
      padding:15px;
      border-radius:16px;
      border:1px solid #e5e7eb;
      font-size:16px;
      outline:none;
      background:#f9fafb;
    }
    textarea{min-height:90px;resize:none}
    input:focus,select:focus,textarea:focus{
      border-color:#f97316;
      background:white;
      box-shadow:0 0 0 4px rgba(249,115,22,.12);
    }
    button{
      width:100%;
      margin-top:18px;
      padding:16px;
      border:none;
      border-radius:18px;
      background:#111827;
      color:white;
      font-size:17px;
      font-weight:900;
      cursor:pointer;
    }
    button:active{transform:scale(.98)}
    .result{
      display:none;
      animation:pop .25s ease;
    }
    .result.show{display:block}
    @keyframes pop{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    .prompt-box{
      background:#111827;
      color:white;
      padding:18px;
      border-radius:20px;
      margin-top:12px;
      line-height:1.45;
      font-size:17px;
    }
    .mini-title{
      font-size:13px;
      font-weight:900;
      color:#f97316;
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:8px;
    }
    .copy{
      background:#f97316;
      color:white;
      margin-top:12px;
    }
    .footer{
      text-align:center;
      color:#6b7280;
      font-size:13px;
      margin-top:22px;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="logo">Run<span>it</span></div>
  <div class="tagline">
    Fast live-selling prompts for Whatnot, TikTok Live, and stream sellers.
  </div>

  <div class="card">
    <label>What are you selling?</label>
    <input id="item" placeholder="Example: Jordan 1 sneakers" />

    <label>Price / starting bid</label>
    <input id="price" placeholder="Example: $35" />

    <label>Selling vibe</label>
    <select id="vibe">
      <option value="hype">Hype / energetic</option>
      <option value="friendly">Friendly</option>
      <option value="premium">Premium</option>
      <option value="urgent">Urgent</option>
    </select>

    <label>Extra details</label>
    <textarea id="details" placeholder="Size, condition, color, rarity, bundle deal, shipping note..."></textarea>

    <button onclick="generatePrompt()">Run It Up</button>
  </div>

  <div class="card result" id="result">
    <div class="mini-title">Suggested live prompt</div>
    <div class="prompt-box" id="promptText"></div>
    <button class="copy" onclick="copyPrompt()">Copy Prompt</button>
  </div>

  <div class="footer">
    Built for sellers who need something to say fast.
  </div>
</div>

<script>
function generatePrompt(){
  const item = document.getElementById("item").value.trim();
  const price = document.getElementById("price").value.trim();
  const vibe = document.getElementById("vibe").value;
  const details = document.getElementById("details").value.trim();

  if(!item){
    alert("Add what you’re selling first.");
    return;
  }

  let opener = "";

  if(vibe === "hype"){
    opener = "Alright chat, we’re running this one right now — don’t sleep on it.";
  } else if(vibe === "friendly"){
    opener = "Okay chat, this is a good one if you’ve been looking for a solid pickup.";
  } else if(vibe === "premium"){
    opener = "This is one of the cleaner pieces tonight. Definitely worth paying attention to.";
  } else if(vibe === "urgent"){
    opener = "Quick run, chat. This one is moving fast, so jump in if you want it.";
  }

  const priceLine = price ? `Starting at ${price}. ` : "";
  const detailLine = details ? `${details}. ` : "";

  const prompt =
    `${opener}\n\n` +
    `${item}. ${priceLine}${detailLine}\n\n` +
    `If you’re watching and thinking about it, this is the time to get in. Let’s run it up.`;

  document.getElementById("promptText").innerText = prompt;
  document.getElementById("result").classList.add("show");
}

function copyPrompt(){
  const text = document.getElementById("promptText").innerText;
  navigator.clipboard.writeText(text);
  alert("Prompt copied.");
}
</script>

</body>
</html>
